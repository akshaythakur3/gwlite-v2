<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Workspace Lite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <h2>Workspace Lite</h2>
        <div>
            <span id="user-name"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <main class="dashboard">
        <div class="dashboard-actions">
            <button onclick="openDocumentModal()">+ New Document</button>
            <button onclick="openFolderModal()">+ New Folder</button>
        </div>
        <p id="dashboard-message" class="dashboard-message" role="status" aria-live="polite"></p>

        <section>
            <h3>My Folders</h3>
            <ul id="my-folders" class="doc-list"></ul>
        </section>

        <section>
            <h3>My Documents</h3>
            <ul id="my-documents" class="doc-list"></ul>
        </section>

        <section>
            <h3>Shared With Me</h3>
            <ul id="shared-documents" class="doc-list"></ul>
        </section>
    </main>

    <div id="document-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="document-modal-title">
        <div class="modal-content">
            <h3 id="document-modal-title">New document</h3>
            <form id="create-document-form">
                <label for="new-document-title">Document title</label>
                <input type="text" id="new-document-title" maxlength="200" value="Untitled Document" required>
                <p id="document-error" class="form-error" role="alert"></p>
                <div class="modal-actions">
                    <button type="submit">Create document</button>
                    <button type="button" class="secondary-button" onclick="closeCreateModal('document-modal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="folder-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="folder-modal-title">
        <div class="modal-content">
            <h3 id="folder-modal-title">New folder</h3>
            <form id="create-folder-form">
                <label for="new-folder-name">Folder name</label>
                <input type="text" id="new-folder-name" maxlength="120" required>
                <p id="folder-error" class="form-error" role="alert"></p>
                <div class="modal-actions">
                    <button type="submit">Create folder</button>
                    <button type="button" class="secondary-button" onclick="closeCreateModal('folder-modal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
