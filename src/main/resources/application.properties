spring.application.name=google-workspace-lite

# --- Database (H2 in-memory by default, so it runs with zero setup) ---
spring.datasource.url=jdbc:h2:mem:gwlite;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- To switch to MySQL, comment the H2 block above and uncomment below ---
# spring.datasource.url=jdbc:mysql://localhost:3306/gwlite?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
jwt.secret=ChangeThisToALongRandomSecretKeyForProductionUse123456789
jwt.expiration-ms=86400000

server.port=8080

# --- Redis (#1 pub/sub scaling, #2 caching/presence, #5 rate limiting) ---
redis.host=localhost
redis.port=6379

# --- S3 (#4 versioning snapshots) ---
aws.s3.bucket=gwlite-document-versions
aws.region=us-east-1
# AWS credentials should come from the standard credential chain
# (environment vars / IAM role), never hardcoded here.

# --- Actuator / Monitoring (#6) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=true

# GCP Cloud Monitoring (Stackdriver) - requires a GCP project + credentials.
# Disabled by default so the app runs without a GCP account; flip to true
# and set your project id to actually ship metrics to GCP.
management.stackdriver.metrics.export.enabled=false
management.stackdriver.metrics.export.project-id=your-gcp-project-id
management.stackdriver.metrics.export.step=1m
